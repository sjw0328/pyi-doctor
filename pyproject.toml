[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyi-doctor"
version = "1.0.0"
description = "Build PyInstaller apps as portable exe + installer, then check startup, antivirus risk factors and bundled licenses."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "서주원 (OMEGA SYSTEMS)", email = "seodes105@gmail.com" }]
keywords = ["pyinstaller", "installer", "inno-setup", "antivirus", "false-positive", "sbom", "windows", "packaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "pyinstaller>=6.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/sjw0328/pyi-doctor"
Issues = "https://github.com/sjw0328/pyi-doctor/issues"

[project.scripts]
pyi-doctor = "pyi_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs a real PyInstaller build (slow)"]
addopts = "-ra"
